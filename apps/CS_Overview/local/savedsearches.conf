
[Interactive Logon Count Failures]
action.email.useNSSubject = 1
action.webhook.enable_allowlist = 0
alert.track = 0
cron_schedule = 3,18,33,48 * * * *
description = Includes Windows and Linux
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
request.ui_dispatch_app = CS_Overview
request.ui_dispatch_view = search
search = index=winevents source="wineventlog:security" EventCode=4625 Logon_Type=2 OR Logon_Type=7 OR Logon_Type=10 \
| dedup _time Account_Name\
| append [search index=nix (sourcetype=audit_log op="PAM:authentication"  exe="/usr/lib/gdm3/gdm-session-worker" NOT acct=gdm res=failed)]\
| stats count

[Interactive Logon Count]
